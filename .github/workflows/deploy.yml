name: Deploy

on:
  push:
    branches:
      - main
  # Dev deploys are manual: every branch pushing to the shared dev stage
  # meant concurrent feature branches raced each other.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # Must match the region holding the SST state (sst-state-ohbbkordfsow).
          # us-east-1 resolved to a separate, incomplete state, so every deploy
          # tried to re-create the existing CloudFront distribution.
          aws-region: eu-west-1


      - name: Deploy to Production
        if: github.event_name == 'push'
        run: npm exec sst deploy -- --stage production
        env:
          AWS_PROFILE: ''

      - name: Deploy to Dev
        if: github.event_name == 'workflow_dispatch'
        run: npm exec sst deploy -- --stage dev
        env:
          AWS_PROFILE: ''

      - name: Verify deployment
        run: |
          echo "Checking deployment status..."
          # SST has a known display bug causing false failures
          # Resources are created successfully despite RangeError messages
